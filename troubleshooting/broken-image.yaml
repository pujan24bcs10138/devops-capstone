apiVersion: apps/v1
kind: Deployment
metadata:
  name: logitrack-broken-image
  namespace: logitrack
spec:
  replicas: 1
  selector:
    matchLabels:
      app: broken-image
  template:
    metadata:
      labels:
        app: broken-image
    spec:
      containers:
        - name: backend
          image: ghcr.io/example/logitrack-backend:does-not-exist
